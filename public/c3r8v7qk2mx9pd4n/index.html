<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>celestial ai.</title>



    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    @import url('/assets/css/theme.css');

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }



        html,

        body {

            width: 100%;

            height: 100%;

        }



        body {

            background: var(--background);

            color: var(--color);

            font-family: "Inter", sans-serif;

            overflow: hidden;

        }



        button,

        input,

        textarea,

        select {

            font: inherit;

            color: var(--color);

        }



        button {

            cursor: pointer;

        }



        .app {

            height: 100vh;

            display: flex;

        }



        .sidebar {

            width: 260px;

            min-width: 260px;

            background: var(--pallet2);

            border-right: 1px solid var(--border);

            display: flex;

            flex-direction: column;

        }



        .sidebar-top {

            padding: 16px 12px;

        }



        .logo {

            font-size: 21px;

            font-weight: 700;

            margin-bottom: 15px;

        }



        .new-chat {

            width: 100%;

            height: 42px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: var(--button);

            text-align: left;

            padding: 0 13px;

        }



        .new-chat:hover,

        .sidebar-btn:hover,

        .tool-btn:hover,

        .icon-btn:hover,

        .send:hover,

        .settings-save:hover,

        .suggestion:hover {

            background: var(--pallet-hover);

        }



        .sidebar-label {

            padding: 8px 14px;

            font-size: 11px;

            opacity: .45;

            text-transform: uppercase;

            letter-spacing: .08em;

        }



        .history {

            flex: 1;

            overflow-y: auto;

            padding: 0 7px;

        }



        .history-item {

            display: flex;

            align-items: center;

            gap: 6px;

            height: 40px;

            border-radius: 8px;

            padding: 0 9px;

            font-size: 13px;

        }



        .history-item:hover,

        .history-item.active {

            background: var(--pallet-hover);

        }



        .history-title {

            flex: 1;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            cursor: pointer;

        }



        .history-delete {

            border: 0;

            background: transparent;

            opacity: .4;

            padding: 5px;

        }



        .sidebar-bottom {

            border-top: 1px solid var(--border);

            padding: 8px;

        }



        .sidebar-btn {

            width: 100%;

            border: 0;

            background: transparent;

            border-radius: 8px;

            padding: 10px;

            text-align: left;

        }



        .main {

            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

        }



        .header {

            height: 58px;

            min-height: 58px;

            border-bottom: 1px solid var(--border);

            display: flex;

            align-items: center;

            padding: 0 16px;

            gap: 10px;

        }



        .menu {

            display: none;

        }



        .header-title {

            flex: 1;

            font-size: 14px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }



        .model {

            font-size: 12px;

            opacity: .65;

            border: 1px solid var(--border);

            border-radius: 7px;

            padding: 6px 9px;

        }



        .limit {

            font-size: 11px;

            opacity: .45;

        }



        .messages {

            flex: 1;

            overflow-y: auto;

        }



        .empty {

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            padding: 25px;

            text-align: center;

        }



        .empty h1 {

            font-size: 31px;

            margin-bottom: 6px;

        }



        .empty p {

            opacity: .45;

            margin-bottom: 24px;

        }



        .suggestions {

            width: min(620px, 100%);

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

        }



        .suggestion {

            border: 1px solid var(--border);

            background: var(--input);

            border-radius: 10px;

            padding: 13px;

            color: var(--color);

            text-align: left;

        }



        .message {

            padding: 21px 22px;

        }



        .message-inner {

            width: min(820px, 100%);

            margin: auto;

            display: flex;

            gap: 13px;

        }



        .message.user .message-inner {

            justify-content: flex-end;

        }



        .avatar {

            width: 31px;

            height: 31px;

            min-width: 31px;

            border-radius: 8px;

            background: var(--pallet);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 11px;

            font-weight: 700;

        }



        .message.user .avatar {

            background: var(--button);

        }



        .content {

            max-width: calc(100% - 45px);

            line-height: 1.65;

            overflow-wrap: anywhere;

        }



        .message.user .content {

            max-width: 78%;

        }



        .message.user .bubble {

            background: var(--button);

            border: 1px solid var(--border);

            border-radius: 15px;

            padding: 10px 14px;

        }



        .bubble p {

            margin-bottom: 11px;

        }



        .bubble p:last-child {

            margin-bottom: 0;

        }



        .bubble h1,

        .bubble h2,

        .bubble h3 {

            margin: 16px 0 8px;

        }



        .bubble ul,

        .bubble ol {

            padding-left: 24px;

            margin: 9px 0;

        }



        .bubble pre {

            position: relative;

            overflow-x: auto;

            background: var(--pallet2);

            border: 1px solid var(--border);

            border-radius: 9px;

            padding: 14px;

            margin: 12px 0;

        }



        .bubble code {

            font-family: Consolas, monospace;

        }



        .bubble :not(pre)>code {

            background: var(--pallet2);

            padding: 2px 5px;

            border-radius: 4px;

        }



        .code-copy {

            position: absolute;

            top: 5px;

            right: 5px;

            border: 1px solid var(--border);

            background: var(--button);

            border-radius: 5px;

            padding: 4px 7px;

            font-size: 10px;

        }



        .math {

            display: inline-block;

            font-family: "Times New Roman", serif;

            font-size: 1.1em;

        }



        .math.block {

            display: block;

            text-align: center;

            margin: 14px 0;

            font-size: 1.25em;

        }



        .fraction {

            display: inline-flex;

            flex-direction: column;

            vertical-align: middle;

            text-align: center;

            margin: 0 3px;

        }



        .fraction .top {

            border-bottom: 1px solid currentColor;

            padding: 0 3px;

        }



        .fraction .bottom {

            padding: 0 3px;

        }



        .message-image {

            display: block;

            max-width: min(420px, 100%);

            max-height: 400px;

            object-fit: contain;

            border-radius: 10px;

            border: 1px solid var(--border);

            margin-bottom: 8px;

        }



        .file-chip {

            display: inline-flex;

            gap: 7px;

            align-items: center;

            padding: 7px 10px;

            background: var(--pallet2);

            border: 1px solid var(--border);

            border-radius: 8px;

            margin-bottom: 7px;

            font-size: 12px;

        }



        .typing {

            display: flex;

            gap: 5px;

            padding-top: 9px;

        }



        .typing span {

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background: var(--color);

            opacity: .25;

            animation: dot 1s infinite;

        }



        .typing span:nth-child(2) {

            animation-delay: .15s;

        }



        .typing span:nth-child(3) {

            animation-delay: .3s;

        }



        @keyframes dot {

            50% {

                opacity: 1;

                transform: translateY(-4px);

            }

        }



        .composer-wrap {

            padding: 7px 15px 14px;

        }



        .attachments {

            width: min(820px, 100%);

            margin: 0 auto 7px;

            display: flex;

            gap: 7px;

            overflow-x: auto;

        }



        .attachment {

            position: relative;

            width: 72px;

            height: 72px;

            min-width: 72px;

            border: 1px solid var(--border);

            border-radius: 9px;

            overflow: hidden;

            background: var(--pallet2);

        }



        .attachment img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }



        .pdf-attachment {

            width: 160px;

            display: flex;

            align-items: center;

            padding: 8px;

            font-size: 11px;

            overflow: hidden;

        }



        .attachment-remove {

            position: absolute;

            top: 3px;

            right: 3px;

            width: 20px;

            height: 20px;

            border: 0;

            border-radius: 50%;

            background: var(--pallet2);

        }



        .tools {

            width: min(820px, 100%);

            margin: 0 auto 7px;

            display: flex;

            gap: 6px;

            overflow-x: auto;

        }



        .tool-btn {

            white-space: nowrap;

            border: 1px solid var(--border);

            background: var(--input);

            border-radius: 8px;

            padding: 6px 9px;

            font-size: 11px;

        }



        .tool-btn.active {

            background: var(--pallet);

        }



        .composer {

            width: min(820px, 100%);

            margin: auto;

            display: flex;

            align-items: flex-end;

            gap: 7px;

            background: var(--input);

            border: 1px solid var(--border);

            border-radius: 15px;

            padding: 7px;

        }



        .composer:focus-within {

            border-color: var(--pallet);

        }



        .icon-btn,

        .send {

            width: 38px;

            height: 38px;

            min-width: 38px;

            border: 0;

            border-radius: 9px;

            background: var(--button);

        }



        #prompt {

            flex: 1;

            resize: none;

            max-height: 170px;

            min-height: 38px;

            border: 0;

            outline: 0;

            background: transparent;

            padding: 8px 3px;

            color: var(--color);

        }



        #prompt::placeholder {

            color: var(--color);

            opacity: .35;

        }



        .note {

            text-align: center;

            font-size: 10px;

            opacity: .3;

            margin-top: 6px;

        }



        .overlay {

            position: fixed;

            inset: 0;

            z-index: 100;

            background: rgba(0, 0, 0, .7);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 18px;

        }



        .overlay.open {

            display: flex;

        }



        .modal {

            width: min(570px, 100%);

            max-height: 90vh;

            overflow-y: auto;

            background: var(--settings);

            border: 1px solid var(--border);

            border-radius: 14px;

            padding: 19px;

        }



        .modal.large {

            width: min(850px, 100%);

        }



        .modal-head {

            display: flex;

            align-items: center;

            margin-bottom: 18px;

        }



        .modal-head h2 {

            flex: 1;

            font-size: 18px;

        }



        .close {

            border: 0;

            background: transparent;

            font-size: 22px;

        }



        .field {

            margin-bottom: 15px;

        }



        .field label {

            display: block;

            font-size: 12px;

            opacity: .6;

            margin-bottom: 6px;

        }



        .field input,

        .field textarea,

        .field select {

            width: 100%;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: var(--input);

            padding: 10px;

            outline: none;

        }



        .field textarea {

            resize: vertical;

        }



        .settings-save {

            width: 100%;

            border: 1px solid var(--border);

            background: var(--button);

            border-radius: 8px;

            padding: 10px;

        }



        .screen-preview {

            width: 100%;

            max-height: 430px;

            background: black;

            border-radius: 9px;

            border: 1px solid var(--border);

        }



        .screen-controls {

            display: flex;

            gap: 7px;

            margin-top: 10px;

        }



        .screen-controls input {

            flex: 1;

            background: var(--input);

            border: 1px solid var(--border);

            border-radius: 8px;

            padding: 9px;

        }



        .screen-controls button {

            border: 1px solid var(--border);

            background: var(--button);

            border-radius: 8px;

            padding: 8px 12px;

        }



        .screen-answer {

            margin-top: 13px;

            line-height: 1.6;

        }



        .flashcard {

            width: min(600px, 100%);

            min-height: 250px;

            margin: 20px auto;

            border: 1px solid var(--border);

            border-radius: 15px;

            background: var(--input);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            text-align: center;

            cursor: pointer;

        }



        .flashcard-text {

            font-size: 20px;

        }



        .study-controls {

            display: flex;

            justify-content: center;

            gap: 7px;

        }



        .study-controls button {

            border: 1px solid var(--border);

            background: var(--button);

            border-radius: 8px;

            padding: 8px 13px;

        }



        .quiz-question {

            margin-bottom: 20px;

        }



        .quiz-question h3 {

            margin-bottom: 10px;

        }



        .quiz-option {

            width: 100%;

            display: block;

            margin: 5px 0;

            padding: 9px;

            text-align: left;

            border: 1px solid var(--border);

            border-radius: 8px;

            background: var(--input);

        }



        .quiz-option.selected {

            background: var(--pallet);

        }



        .quiz-result {

            margin-top: 15px;

            font-weight: 600;

        }



        .toast {

            position: fixed;

            z-index: 999;

            left: 50%;

            bottom: 25px;

            transform: translate(-50%, 15px);

            background: var(--settings);

            border: 1px solid var(--border);

            border-radius: 8px;

            padding: 9px 13px;

            font-size: 12px;

            opacity: 0;

            pointer-events: none;

            transition: .2s;

        }



        .toast.show {

            opacity: 1;

            transform: translate(-50%, 0);

        }



        @media(max-width:760px) {

            .sidebar {

                position: fixed;

                z-index: 80;

                left: -270px;

                top: 0;

                transition: .2s;

            }



            .sidebar.open {

                left: 0;

            }



            .menu {

                display: block;

            }



            .model,

            .limit {

                display: none;

            }



            .suggestions {

                grid-template-columns: 1fr;

            }



            .message {

                padding: 17px 12px;

            }



            .message.user .content {

                max-width: 88%;

            }



            .composer-wrap {

                padding: 7px 9px 10px;

            }

        }


        .tool-btn,
        .new-chat,
        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .tool-btn svg,
        .new-chat svg,
        .sidebar-btn svg,
        .icon-btn svg,
        .send svg {
            width: 16px;
            height: 16px;
            stroke-width: 2
        }

        .icon-btn,
        .send {
            display: inline-flex;
            align-items: center;
            justify-content: center
        }

        .drop-overlay {
            position: fixed;
            inset: 12px;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--border);
            border-radius: 18px;
            background: rgba(8, 9, 12, .92);
            backdrop-filter: blur(10px);
            pointer-events: none
        }

        .drop-overlay.open {
            display: flex
        }

        .drop-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 15px
        }

        .drop-card svg {
            width: 34px;
            height: 34px
        }

        .math-radicand {
            border-top: 1px solid currentColor;
            padding: 1px 2px 0
        }

        .math-box {
            display: inline-block;
            border: 1px solid currentColor;
            padding: 0 4px;
            border-radius: 2px
        }

        .math-overline {
            display: inline-block;
            border-top: 1px solid currentColor;
            padding-top: 1px
        }

        .math-underline {
            display: inline-block;
            border-bottom: 1px solid currentColor
        }

        .math-vector,
        .math-line {
            display: inline-block;
            border-top: 1px solid currentColor
        }
    </style>

</head>



<body theme="default">



    <div class="app">



        <aside class="sidebar" id="sidebar">

            <div class="sidebar-top">

                <div class="logo">celestial AI.</div>

                <button class="new-chat" id="newChat"><i data-lucide="plus"></i><span>new chat</span></button>

            </div>



            <div class="sidebar-label">conversations</div>

            <div class="history" id="history"></div>



            <div class="sidebar-bottom">

                <button class="sidebar-btn" id="settingsButton"><i
                        data-lucide="settings"></i><span>settings</span></button>

                <button class="sidebar-btn" id="clearHistory"><i data-lucide="trash-2"></i><span>clear
                        history</span></button>

            </div>

        </aside>



        <main class="main">



            <header class="header">

                <button class="icon-btn menu" id="menu"><i data-lucide="menu"></i></button>

                <div class="header-title" id="title">new conversation</div>

                <div class="limit" id="limit">130 left</div>



            </header>



            <div class="messages" id="messages"></div>



            <div class="composer-wrap">



                <div class="attachments" id="attachments"></div>



                <div class="tools">

                    <button class="tool-btn" id="screenButton"><i data-lucide="monitor-up"></i><span>screen
                            share</span></button>

                    <button class="tool-btn" id="flashcardsButton"><i
                            data-lucide="layers-3"></i><span>flashcards</span></button>

                    <button class="tool-btn" id="quizButton"><i data-lucide="list-checks"></i><span>quiz</span></button>

                    <button class="tool-btn" id="pdfButton"><i data-lucide="file-text"></i><span>pdf</span></button>

                </div>



                <div class="composer">

                    <button class="icon-btn" id="imageButton"><i data-lucide="paperclip"></i></button>



                    <textarea id="prompt" rows="1" placeholder="send a message.."></textarea>



                    <button class="send" id="send"><i data-lucide="arrow-up"></i></button>

                </div>



                <div class="note">

                    celestial AI · 130 prompts every 3 hours

                </div>



            </div>

        </main>

    </div>



    <input id="imageInput" type="file" accept="image/*" multiple hidden>

    <input id="pdfInput" type="file" accept="application/pdf" hidden>



    <div class="overlay" id="settingsOverlay">

        <div class="modal">



            <div class="modal-head">

                <h2>ai settings</h2>

                <button class="close" data-close="settingsOverlay">×</button>

            </div>



            <div class="field">

                <label>model</label>

                <input id="modelInput" value="gpt-6-astra">

            </div>



            <div class="field" style="display:none;">

                <label>ai name</label>

                <input id="aiName" value="celestial">

            </div>



            <div class="field">

                <label>personality</label>



                <select id="personality">

                    <option value="default">default</option>

                    <option value="friendly">friendly</option>

                    <option value="concise">concise</option>

                    <option value="teacher">teacher</option>

                    <option value="creative">creative</option>

                    <option value="professional">professional</option>

                    <option value="custom">custom</option>

                </select>

            </div>



            <div class="field">

                <label>custom personality / system prompt</label>



                <textarea id="systemPrompt" rows="8" placeholder="describe how the ai should respond..."></textarea>

            </div>



            <button class="settings-save" id="saveSettings">save</button>



        </div>

    </div>



    <div class="overlay" id="screenOverlay">

        <div class="modal large">



            <div class="modal-head">

                <h2>screen share</h2>

                <button class="close" data-close="screenOverlay">×</button>

            </div>



            <video class="screen-preview" id="screenVideo" autoplay muted playsinline></video>



            <div class="screen-controls">

                <input id="screenQuestion" placeholder="ask something about your screen...">



                <button id="askScreen">ask</button>

                <button id="stopScreen">stop</button>

            </div>



            <div class="screen-answer" id="screenAnswer"></div>



        </div>

    </div>



    <div class="overlay" id="studyOverlay">

        <div class="modal large">



            <div class="modal-head">

                <h2 id="studyTitle">study</h2>

                <button class="close" data-close="studyOverlay">×</button>

            </div>



            <div id="studyContent"></div>



        </div>

    </div>



    <div class="drop-overlay" id="dropOverlay">
        <div class="drop-card"><i data-lucide="upload-cloud"></i><span>drop an image or pdf</span></div>
    </div>
    <div class="toast" id="toast"></div>



    <script src="https://unpkg.com/lucide@latest"></script>

    <script>

        const CHAT_API = "/api/chat";

        const SCREEN_API = "/api/screenshare";

        const PDF_API = "/api/pdf";



        const SESSION_KEY = "celestial-ai-sessions-v3";

        const SETTINGS_KEY = "celestial-ai-settings-v3";

        const LIMIT_KEY = "celestial-ai-limit-v3";

        const DEVICE_KEY = "celestial-device-id-v1";



        const LIMIT_MAX = 130;

        const LIMIT_WINDOW = 3 * 60 * 60 * 1000;



        const $ = id => document.getElementById(id);



        const messagesEl = $("messages");

        const historyEl = $("history");

        const promptEl = $("prompt");

        const sendButton = $("send");

        const attachmentsEl = $("attachments");



        let sessions = readJSON(SESSION_KEY, []);

        let currentId = null;

        let images = [];

        let pdf = null;

        let screenStream = null;

        let screenPipWindow = null;

        let screenFrameTimer = null;

        let sending = false;



        let settings = {

            model: "gpt-6-astra",

            aiName: "celestial",

            personality: "default",

            systemPrompt: "",

            ...readJSON(SETTINGS_KEY, {})

        };



        const deviceId = getDeviceId();



        function getDeviceId() {

            let id = localStorage.getItem(DEVICE_KEY);



            if (!id) {

                id = crypto.randomUUID();

                localStorage.setItem(DEVICE_KEY, id);

            }



            return id;

        }



        function readJSON(key, fallback) {

            try {

                return JSON.parse(localStorage.getItem(key)) ?? fallback;

            } catch {

                return fallback;

            }

        }



        function writeJSON(key, value) {

            localStorage.setItem(key, JSON.stringify(value));

        }



        function id(prefix = "id") {

            return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);

        }



        function escapeHTML(value = "") {

            return String(value)

                .replaceAll("&", "&amp;")

                .replaceAll("<", "&lt;")

                .replaceAll(">", "&gt;")

                .replaceAll('"', "&quot;")

                .replaceAll("'", "&#039;");

        }



        function toast(text) {

            const el = $("toast");



            el.textContent = text;

        function markdown(text = "") {

            let safe = escapeHTML(text);



            const codeBlocks = [];



            safe = safe.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {

                const token = `%%CODE${codeBlocks.length}%%`;



                codeBlocks.push(`

            <pre>

                <button class="code-copy">copy</button><code>${code.trim()}</code>

            </pre>

        `);



                return token;

            });



            safe = renderMath(safe);



            safe = safe

                .replace(/^### (.+)$/gm, "<h3>$1</h3>")

                .replace(/^## (.+)$/gm, "<h2>$1</h2>")

                .replace(/^# (.+)$/gm, "<h1>$1</h1>")

                .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")

                .replace(/\*(.+?)\*/g, "<em>$1</em>")

                .replace(/`([^`]+)`/g, "<code>$1</code>")

                .replace(/\n\n/g, "</p><p>")

                .replace(/\n/g, "<br>");



            safe = "<p>" + safe + "</p>";



            codeBlocks.forEach((block, index) => {

                safe = safe.replace(`%%CODE${index}%%`, block);

            });



            return safe;

        }



        function renderMath(text) {

            text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, math) => {

                return `<span class="math block">${mathSymbols(math)}</span>`;

            });



            text = text.replace(/\$([^$\n]+?)\$/g, (_, math) => {

                return `<span class="math">${mathSymbols(math)}</span>`;

            });



            return text;

        }



        function mathSymbols(math) {

            let output = math;



            const symbols = {

                "\\\alpha": "α",

                "\\\beta": "β",

                "\\\gamma": "γ",

                "\\\delta": "δ",

                "\\\theta": "θ",

                "\\\lambda": "λ",

                "\\\mu": "μ",

                "\\\pi": "π",

                "\\\sigma": "σ",

                "\\\phi": "φ",

                "\\\omega": "ω",

                "\\\Delta": "Δ",

                "\\\Sigma": "Σ",

                "\\\Omega": "Ω",

                "\\\times": "×",

                "\\\div": "÷",

                "\\\pm": "±",

                "\\\cdot": "·",

                "\\\le": "≤",

                "\\\ge": "≥",

                "\\\ne": "≠",

                "\\\approx": "≈",

                "\\\infty": "∞",

                "\\\sqrt": "√",

                "\\\rightarrow": "→",

                "\\\leftarrow": "←",

                "\\\degree": "°"

            };



            Object.entries(symbols).forEach(([key, value]) => {

                output = output.split(key).join(value);

            });



            output = output.replace(

        /**\\\**&#x66;ra&#x63;**\\{**([^{}]+)**\\}\\{**([^{}]+)**\\}**/g,

                `<span class="fraction"><span class="top">$1</span><span class="bottom">$2</span></span>`

            );



            output = output.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");

            output = output.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");

            output = output.replace(/\^([A-Za-z0-9+-]+)/g, "<sup>$1</sup>");

            output = output.replace(/_([A-Za-z0-9+-]+)/g, "<sub>$1</sub>");



            return output;

        }

        async function api(messages, options = {}) {

            const response = await fetch(options.screen ? SCREEN_API : CHAT_API, {

                method: "POST",



                headers: {

                    "Content-Type": "application/json",

                    "X-Device-ID": deviceId

                },



                body: JSON.stringify({

                    model: settings.model || "gpt-6-astra",

                    messages,

                    temperature: options.temperature ?? 0.8,

                    max_tokens: options.maxTokens ?? 2048

                })

            });



            let data;



            try {

                data = await response.json();

            } catch {

                data = {

                    error: await response.text()

                };

            }



            if (!response.ok) {

                if (response.status === 429) {

                    const seconds = Number(data.retryAfter || 0);



                    throw new Error(

                        seconds

                            ? `limit reached. try again in ${Math.ceil(seconds / 60)} minutes.`

                            : "message limit reached."

                    );

                }



                throw new Error(

                    data.error?.message ||

                    data.error ||

                    data.message ||

                    `request failed (${response.status})`

                );

            }



            return (

                data.choices?.[0]?.message?.content ||

                data.content?.[0]?.text ||

                data.output_text ||

                ""

            );

        }

        function fileToBase64(file) {

            return new Promise((resolve, reject) => {

                const reader = new FileReader();



                reader.onload = () => {

                    resolve(String(reader.result).split(",")[1]);

                };



                reader.onerror = reject;

                reader.readAsDataURL(file);

            });

        }

        function captureScreen() {

            canvas.width = Math.round(video.videoWidth * scale);
            canvas.height = Math.round(video.videoHeight * scale);
            canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL("image/jpeg", .72);
        }

                    temperature: .4,

                    maxTokens: 1600

                });



                const cards = parseJSON(response);



                showFlashcards(cards);



            } catch (error) {

                $("studyContent").textContent = error.message;

            }

        }



        function showFlashcards(cards) {

            if (!Array.isArray(cards) || !cards.length) {

                $("studyContent").textContent = "could not create flashcards";

                return;

            }



            let index = 0;

            let showingAnswer = false;



            function render() {

                const card = cards[index];



                $("studyContent").innerHTML = `

            <div class="flashcard" id="flashcard">

                <div class="flashcard-text">

                    ${escapeHTML(showingAnswer ? card.a : card.q)}

                </div>

            </div>



            <div class="study-controls">

                <button id="previousCard">previous</button>

                <button id="flipCard">

                    ${showingAnswer ? "question" : "answer"}

                </button>

                <button id="nextCard">next</button>

            </div>



            <div style="text-align:center;margin-top:10px;opacity:.4;font-size:11px">

                ${index + 1} / ${cards.length}

            </div>

        `;



                $("flashcard").onclick = () => {

                    showingAnswer = !showingAnswer;

                    render();

                };



                $("flipCard").onclick = () => {

                    showingAnswer = !showingAnswer;

                    render();

                };



                $("previousCard").onclick = () => {

                    index = (index - 1 + cards.length) % cards.length;

                    showingAnswer = false;

                    render();

                };



                $("nextCard").onclick = () => {

                    index = (index + 1) % cards.length;

                    showingAnswer = false;

                    render();

                };

            }



            render();

        }



        async function makeQuiz() {

            const source = studySource();



            if (!source) {

                toast("chat about something first");

                return;

            }



            if (!usePrompt()) return;



            $("studyTitle").textContent = "quiz";

            $("studyContent").innerHTML = "generating...";

            $("studyOverlay").classList.add("open");



            try {

                const response = await api([

                    {

                        role: "system",

                        content:

                            `Create a quiz from the supplied study material.



Return ONLY valid JSON.

No markdown.

No code fence.



Format:

[

  {

    "q":"question",

    "options":["A","B","C","D"],

    "answer":0

  }

]



"answer" must be the zero-based index of the correct option.



Create 8 questions.`

                    },

                    {

                        role: "user",

                        content: source

                    }

                ], {

                    temperature: .4,

                    maxTokens: 2200

                });



                const quiz = parseJSON(response);



                showQuiz(quiz);



            } catch (error) {

                $("studyContent").textContent = error.message;

            }

        }



        function showQuiz(quiz) {

            if (!Array.isArray(quiz) || !quiz.length) {

                $("studyContent").textContent = "could not create quiz";

                return;

            }



            const answers = new Array(quiz.length).fill(null);



            $("studyContent").innerHTML =

                quiz.map((question, qIndex) => `

            <div class="quiz-question">

                <h3>

                    ${qIndex + 1}. ${escapeHTML(question.q)}

                </h3>



                ${question.options.map((option, oIndex) => `

                    <button

                        class="quiz-option"

                        data-q="${qIndex}"

                        data-o="${oIndex}"

                    >

                        ${escapeHTML(option)}

                    </button>

                `).join("")}

            </div>

        `).join("") +

                `

            <button class="settings-save" id="gradeQuiz">

                grade quiz

            </button>



            <div class="quiz-result" id="quizResult"></div>

        `;



            document.querySelectorAll(".quiz-option").forEach(button => {

                button.onclick = () => {

                    const q = Number(button.dataset.q);

                    const o = Number(button.dataset.o);



                    answers[q] = o;



                    document.querySelectorAll(`[data-q="${q}"]`).forEach(item => {

                        item.classList.remove("selected");

                    });



                    button.classList.add("selected");

                };

            });



            $("gradeQuiz").onclick = () => {

                let correct = 0;



                quiz.forEach((question, index) => {

                    if (answers[index] === Number(question.answer)) {

                        correct++;

                    }

                });



                $("quizResult").textContent =

                    `${correct} / ${quiz.length} correct`;

            };

        }



        function parseJSON(text) {

            let value = String(text).trim();



            value = value.replace(/^```json/i, "");

            value = value.replace(/^```/, "");

            value = value.replace(/```$/, "");

            value = value.trim();



            const start = Math.min(

                ...["[", "{"]

                    .map(char => value.indexOf(char))

                    .filter(index => index >= 0)

            );



            if (Number.isFinite(start)) {

                value = value.slice(start);

            }



            return JSON.parse(value);

        }



        function resizePrompt() {

            promptEl.style.height = "auto";



            promptEl.style.height =

                Math.min(promptEl.scrollHeight, 170) + "px";



            updateSend();

        }



        function updateSend() {

            sendButton.disabled =

                sending ||

                (!promptEl.value.trim() && !images.length && !pdf);

        }



        function scrollBottom() {

            requestAnimationFrame(() => {

                messagesEl.scrollTop = messagesEl.scrollHeight;

            });

        }



        function openSettings() {

            $("modelInput").value = settings.model;

            $("aiName").value = settings.aiName;

            $("personality").value = settings.personality;

            $("systemPrompt").value = settings.systemPrompt;



            $("settingsOverlay").classList.add("open");

        }



        function saveSettings() {

            settings = {

                model: $("modelInput").value.trim() || "gpt-6-astra",

                aiName: $("aiName").value.trim() || "celestial",

                personality: $("personality").value,

                systemPrompt: $("systemPrompt").value.trim()

            };



            writeJSON(SETTINGS_KEY, settings);



            $("settingsOverlay").classList.remove("open");



            toast("settings saved");

        }



        $("newChat").onclick = () => {

            createSession();

            promptEl.value = "";

            images = [];

            pdf = null;

            renderAttachments();

            resizePrompt();

        };



        $("clearHistory").onclick = () => {

            sessions = [];

            localStorage.removeItem(SESSION_KEY);

            createSession();

        };



        $("settingsButton").onclick = openSettings;

        $("saveSettings").onclick = saveSettings;



        $("menu").onclick = () => {

            $("sidebar").classList.toggle("open");

        };



        $("send").onclick = sendMessage;



        promptEl.oninput = resizePrompt;



        promptEl.onkeydown = event => {

            if (event.key === "Enter" && !event.shiftKey) {

                event.preventDefault();

                sendMessage();

            }

        };



        $("imageButton").onclick = () => $("imageInput").click();



        $("imageInput").onchange = event => {

            addImages(event.target.files);

            event.target.value = "";

        };



        $("pdfButton").onclick = () => $("pdfInput").click();



        $("pdfInput").onchange = event => {

            uploadPDF(event.target.files[0]);

            event.target.value = "";

        };



        $("screenButton").onclick = () => { if (screenStream && screenPipWindow && !screenPipWindow.closed) screenPipWindow.focus(); else if (!screenStream) startScreenShare(); };

        $("askScreen").onclick = askScreen;



        $("stopScreen").onclick = () => {

            stopScreenShare();

            $("screenOverlay").classList.remove("open");

        };



        $("flashcardsButton").onclick = makeFlashcards;

        $("quizButton").onclick = makeQuiz;



        document.querySelectorAll("[data-close]").forEach(button => {

            button.onclick = () => {

                const overlay = $(button.dataset.close);



                overlay.classList.remove("open");



                if (button.dataset.close === "screenOverlay") {

                    stopScreenShare();

                }

            };

        });



        document.querySelectorAll(".overlay").forEach(overlay => {

            overlay.addEventListener("click", event => {

                if (event.target !== overlay) return;



                overlay.classList.remove("open");



                if (overlay.id === "screenOverlay") {

                    stopScreenShare();

                }

            });

        });



        let dragDepth = 0;

        document.addEventListener("dragenter", event => { event.preventDefault(); dragDepth++; $("dropOverlay").classList.add("open"); });
        document.addEventListener("dragover", event => event.preventDefault());
        document.addEventListener("dragleave", event => { event.preventDefault(); dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("dropOverlay").classList.remove("open"); });
        document.addEventListener("drop", event => {
            event.preventDefault();
            dragDepth = 0;
            $("dropOverlay").classList.remove("open");
            const files = [...event.dataTransfer.files];
            const imageFiles = files.filter(file => file.type.startsWith("image/"));
            const pdfFile = files.find(file => file.type === "application/pdf");
            if (imageFiles.length) addImages(imageFiles);
            if (pdfFile) uploadPDF(pdfFile);
        });

        if (sessions.length) {

            currentId = sessions[0].id;

            openSession(currentId);

        } else {

            createSession();

        }



        lucide.createIcons();

        updateLimit();

        resizePrompt();

    </script>



</body>
<script src="/assets/js/theme.js"></script>
