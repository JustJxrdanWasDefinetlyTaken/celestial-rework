<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>celestial.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            height: 100vh;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: #2d2d2d;
            border-bottom: 1px solid #3d3d3d;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 4px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            padding: 8px 12px 0;
            background: #242424;
            overflow-x: auto;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 150px;
            max-width: 240px;
            padding: 9px 10px;
            border: 1px solid #3d3d3d;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            background: #2d2d2d;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
        }

        .tab.active {
            background: #1a1a1a;
            color: white;
        }

        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .tab-close {
            padding: 0 4px;
            background: transparent;
            color: #aaa;
            font-size: 16px;
        }

        .tab-close:hover {
            background: #4d4d4d;
            color: white;
        }

        .new-tab {
            align-self: flex-start;
            padding: 8px 12px;
        }

        button {
            background: #3d3d3d;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:hover {
            background: #4d4d4d;
        }

        button:active {
            transform: scale(0.95);
        }

        input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #3d3d3d;
            background: #1a1a1a;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0066cc;
        }

        .status {
            padding: 4px 12px;
            background: #3d3d3d;
            border-radius: 6px;
            font-size: 12px;
            color: #aaa;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: none;
        }

        iframe.active {
            display: block;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .viewport {
            flex: 1;
            min-height: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="tabs" id="tabs" role="tablist">
            <button class="new-tab" id="newTab" title="New tab" type="button">+</button>
        </div>
        <div class="toolbar">
            <div class="nav-buttons">
                <button id="backBtn" title="Back">←</button>
                <button id="forwardBtn" title="Forward">→</button>
                <button id="reloadBtn" title="Reload">↻</button>
            </div>
            <input type="text" id="urlInput" placeholder="Enter URL..." value="https://example.com">
            <button id="goBtn">Go</button>
            <div class="status" id="status">Ready</div>
        </div>
        <div class="viewport" id="viewport"></div>
    </div>
    <!--
        STEP 1: Load the libraries. Keep these as plain <script> tags. Do not turn
        them into type="module" / imports. They put their API on the global object
        (window.$scramjet, window.$scramjetController, window.EpoxyTransport), and
        that only happens in a classic script.

        scramjet/ and controller/ need to live at your site root. The service worker
        loads scramjet.js and scramjet.wasm from /scramjet/ and the inject script
        from /controller/, so keep those paths unless you also change the controller
        config.
    -->
    <script src="/clst.magic.js"></script>'
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <!-- Epoxy is the network transport. Drop in a local copy if you don't want the CDN. -->
    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>

    <script>
        // STEP 2: Pull the classes off the globals the scripts above set up.
        const { Controller } = $scramjetController;
        const { defaultConfig } = $scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;

        const urlInput = document.getElementById("urlInput");
        const statusEl = document.getElementById("status");
        const tabsEl = document.getElementById("tabs");
        const viewportEl = document.getElementById("viewport");

        let scramjet = null;
        let activeTabId = null;
        let nextTabId = 1;
        const tabs = new Map();

        function setStatus(t, err = false) {
            statusEl.textContent = t;
            statusEl.style.color = err ? "#ff6b6b" : "#aaa";
        }

        function norm(u) {
            return u.startsWith("http") ? u : "https://" + u;
        }

        function updateTabTitle(tab) {
            let title = "New tab";
            try {
                title = tab.iframe.contentDocument?.title || new URL(tab.url).hostname;
            } catch {
                title = new URL(tab.url).hostname;
            }

            tab.button.querySelector(".tab-title").textContent = title;
            tab.iframe.title = title;
        }

        function selectTab(id) {
            const tab = tabs.get(id);
            if (!tab) return;

            activeTabId = id;
            for (const item of tabs.values()) {
                item.button.classList.toggle("active", item.id === id);
                item.iframe.classList.toggle("active", item.id === id);
            }
            urlInput.value = tab.url;
        }

        function closeTab(id) {
            const tab = tabs.get(id);
            if (!tab) return;

            tab.button.remove();
            tab.iframe.remove();
            tabs.delete(id);

            if (tabs.size === 0) {
                createTab();
            } else if (activeTabId === id) {
                selectTab(tabs.keys().next().value);
            }
        }

        function createTab(url = "https://google.com", title = "New tab") {
            const id = nextTabId++;
            const button = document.createElement("div");
            button.className = "tab";
            button.setAttribute("role", "tab");
            button.innerHTML = '<span class="tab-title"></span><button class="tab-close" title="Close tab" type="button">&times;</button>';
            button.querySelector(".tab-title").textContent = title;
            button.addEventListener("click", () => selectTab(id));
            button.querySelector(".tab-close").addEventListener("click", (event) => {
                event.stopPropagation();
                closeTab(id);
            });

            const iframe = document.createElement("iframe");
            iframe.title = title;
            tabsEl.insertBefore(button, document.getElementById("newTab"));
            viewportEl.appendChild(iframe);

            const tab = { id, button, iframe, frame: null, url };
            tabs.set(id, tab);
            iframe.addEventListener("load", () => updateTabTitle(tab));
            selectTab(id);
            tab.frame = scramjet.createFrame(iframe);
            tab.frame.go(url);
            updateTabTitle(tab);
        }

        async function init() {
            try {
                setStatus("Initializing...");

                // Wait for the service worker (registered at the bottom) to be active.
                await navigator.serviceWorker.ready;

                const serviceworker =
                    navigator.serviceWorker.controller ??
                    (await navigator.serviceWorker.ready).active;

                // STEP 3: Connect a transport to a wisp server.
                // Use your own wisp server in production. Public ones get
                // rate-limited and can go offline.
                const transport = new EpoxyTransport({
                    wisp: "wss://wisp.mercurywork.shop/"
                });

                await transport.init();

                // STEP 4: Create the controller. defaultConfig is fine to start with;
                // change it if you need custom rewriting behaviour.
                scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });

                await scramjet.wait();

                // STEP 5: Create the initial browser tab.
                createTab();

                setStatus("Ready");
            } catch (e) {
                console.error(e);
                setStatus(e.message, true);
            }
        }

        // Navigate the iframe to whatever is typed in the URL bar.
        function go() {
            const url = norm(urlInput.value);
            urlInput.value = url;
            const tab = tabs.get(activeTabId);
            if (!tab) return;
            tab.url = url;
            tab.frame.go(url);
            updateTabTitle(tab);
        }

        document.getElementById("goBtn").onclick = go;
        document.getElementById("newTab").onclick = () => createTab();

        urlInput.addEventListener("keydown", e => {
            if (e.key === "Enter") go();
        });

        // STEP 6: Register the service worker, then boot once it's ready.
        // Service workers only run in a secure context: https:// or http://localhost.
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(init);
        } else {
            setStatus("No service worker support", true);
        }
    </script>
</body>

</html>
